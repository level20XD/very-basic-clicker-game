<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Very Basic Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="center" style="font-family: arial">Very Basic Clicker Game</h1>
    <h1 class="center counter" id="counter">0</h1>
    <p id="percounter" class="center"></p>
    <p id="secondcounter" class="center"></p>
    <div class="center button" id="button">Click</div>
    <!-- Click -->
    <p class="center upgradelimit" id="perlimit">0/10</p>
    <p style="color:lawngreen;" class="center cost" id="percost">0 clicks</p>
    <div class="center upgrade" id="perclick">+1 click</div>
    <!-- Clicks per second -->
    <p class="center upgradelimit" id="secondlimit">0/10</p>
    <p class="center cost" id="secondcost">50 clicks</p>
    <div class="center upgrade" id="persecond">+5 cps</div>
    <!-- Win -->
    <p class="center upgradelimit" id="winlimit">0/1</p>
    <p class="center cost" id="wincost">5000 clicks + MAX upgrades</p>
    <div class="center upgrade" id="winbutton">beat the game</div>
    <script src="code.js"></script>
</body>
</html>
